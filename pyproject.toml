[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "KNBench"
description = "KNBench: counterfactual testing of language models for geopolitical bias and risk blindness."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "LICENSE-DATA"]
dynamic = ["version"]
dependencies = [
    "pydantic==2.14.3",
    "pydantic-settings==2.16.2",
    "httpx==0.28.1",
    "python-dotenv==1.2.4",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "respx==0.23.1",
    "mypy==2.4.1",
    "build==1.6.1",
]

[project.scripts]
knbench = "knbench.main:main"

[tool.setuptools]
packages = ["knbench"]

[tool.setuptools.dynamic]
version = {attr = "knbench.__version__"}

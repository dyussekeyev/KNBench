name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            requirements-dev.txt

      - name: Install the package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verify the console entry point
        run: knbench --version

      - name: Run the offline test suite
        run: python -m pytest -q

      - name: Type-check the sources
        run: python -m mypy --strict knbench

      - name: Build the distribution
        run: python -m build

      - name: Quality gate
        run: |
          if grep -R "print(" knbench/; then
            echo "::error::print() is not allowed in knbench/; use the logging module"
            exit 1
          fi
          knbench validate --scenarios data/scenarios.json --strict-pairs
